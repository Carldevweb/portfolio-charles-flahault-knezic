<section class="section contact" id="contact" aria-labelledby="contact-title">
  <div class="container contact__panel">
    <div><p class="eyebrow">Contact</p><h2 id="contact-title">Échangeons sur votre besoin.</h2></div>
    <div class="contact__content">
      <p>Vous recherchez un développeur Java / Angular ou souhaitez faire évoluer une application web ? Présentez-moi le contexte et les objectifs du projet.</p>
      <div class="contact__actions">
        <a class="button button--primary" [href]="emailComposeUrl" target="_blank" rel="noreferrer">M’écrire <span aria-hidden="true">↗</span></a>
        <a class="button button--secondary" [href]="profile.linkedinUrl" target="_blank" rel="noreferrer">LinkedIn</a>
      </div>
    </div>
  </div>
</section>
